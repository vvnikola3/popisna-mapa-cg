# Builds the app and publishes it to GitHub Pages on every push to main.
# Settings → Pages → Build and deployment → Source must be "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The site lives under https://<user>.github.io/<repo>/.
  # With an own domain (CNAME) this becomes "/".
  BASE_HREF: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx ng build --base-href "$BASE_HREF"

      # GitHub Pages has no rewrites: unknown paths such as /me/2003/jezik/plav
      # get 404.html, so it has to be the app itself.
      - run: cp dist/popisna-mapa-cg/browser/index.html dist/popisna-mapa-cg/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/popisna-mapa-cg/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
