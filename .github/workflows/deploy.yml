# Builds the app and publishes it to GitHub Pages on every push to main.
# Settings → Pages → Build and deployment → Source must be "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The site is served from the root of https://popisi.org (custom domain set in
  # Settings → Pages; with an Actions workflow no CNAME file is needed).
  # Without a custom domain it would be /${{ github.event.repository.name }}/.
  BASE_HREF: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx ng build --base-href "$BASE_HREF"

      # one real HTML page per shareable view (own title/description, HTTP 200
      # for search engines), plus sitemap.xml and robots.txt
      - run: node scripts/build-pages.js

      # any other path (typo, old or ?query-less variant) gets 404.html, so it opens the app too
      - run: cp dist/popisna-mapa-cg/browser/index.html dist/popisna-mapa-cg/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/popisna-mapa-cg/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
